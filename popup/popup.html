<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Easy Stack</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f6fc;
          --muted: #9198a1;
          --bg: #0d1117;
        }
      }
      body {
        width: 260px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 13px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        cursor: pointer;
      }
      input {
        margin: 2px 0 0;
      }
      small {
        display: block;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>GitHub Easy Stack</h1>
    <label>
      <input type="checkbox" id="fold-by-default" />
      <span>
        Fold stacks by default
        <small>Changing this resets stacks you folded or unfolded by hand.</small>
      </span>
    </label>
    <script src="popup.js"></script>
  </body>
</html>
